name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s app -v
      - name: Blocking SAST and secret scan
        run: >-
          docker run --rm -v "$PWD:/src"
          semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
          semgrep scan --config p/python --config p/secrets --error app Dockerfile
      - uses: azure/setup-helm@v4.3.1
      - run: helm lint charts/quote-api && helm template quote-api charts/quote-api > /tmp/rendered.yaml
      - run: bash -n scripts/*.sh
  publish:
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/sonqn/elsa:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/sonqn/elsa
